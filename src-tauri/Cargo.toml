[package]
name = "clawbox"
version = "0.5.5"
description = "Unified configuration center for AI agents — providers, MCP, skills and memory in one place"
authors = ["you"]
edition = "2021"

[lib]
name = "clawbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
toml_edit = "0.22"
rayon = "1.10"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# 只读 cc-switch 的 SQLite 数据源(~/.cc-switch/cc-switch.db)用于一键导入。
# bundled:随包编译 libsqlite3,免系统依赖。
rusqlite = { version = "0.32", features = ["bundled"] }
